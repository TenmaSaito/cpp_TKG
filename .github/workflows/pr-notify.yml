name: PR チェック結果のDiscord通知
on:
  pull_request_target:
    types: [opened, reopened]
  workflow_run:
    workflows: ["PR 自動品質チェック"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  notify-opened:
    name: PR作成をDiscordへ通知
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: 通知スクリプトを取得
        uses: actions/checkout@v6
      - name: PR作成メッセージを送信
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 tools/notify_discord.py opened
  notify-results:
    name: 検査結果をDiscordへ通知
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: 通知スクリプトを取得
        uses: actions/checkout@v6
      - name: 検査結果メッセージを送信
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 tools/notify_discord.py completed
