name: PR 自動品質チェック
run-name: "PR #${{ github.event.pull_request.number }} の自動検査"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  naming:
    name: 命名規則チェック
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STRICT_NAMING: ${{ vars.STRICT_NAMING }}
    steps:
      # PRのマージ結果。ここにはSecretsを渡さない
      - name: PRのソースコードを取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # チェッカーと規則はPR内で変更されたものを使わず、ベース側のものを使う
      - name: ベースブランチから検査ツールと命名規則を取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .prguard-base
          persist-credentials: false

      - name: GitHub上にPythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: ファイル名の命名規則を検査
        id: filenames
        continue-on-error: true
        run: >-
          python .prguard-base/tools/check_filenames.py
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --policy .prguard-base/naming_policy.json

      - name: C++変数名・定数名の命名規則を検査
        id: identifiers
        continue-on-error: true
        run: |
          if [ "${STRICT_NAMING,,}" = "true" ]; then
            python .prguard-base/tools/check_identifiers.py \
              --base "$BASE_SHA" --head "$HEAD_SHA" \
              --policy .prguard-base/naming_policy.json
          else
            python .prguard-base/tools/check_identifiers.py \
              --base "$BASE_SHA" --head "$HEAD_SHA" \
              --policy .prguard-base/naming_policy.json --no-fail
          fi

      - name: Discord通知用のPR情報を作成
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PYMETA'
          import json, os
          from pathlib import Path
          Path('reports').mkdir(exist_ok=True)
          Path('reports/pr_metadata.json').write_text(
              json.dumps({'pr_number': int(os.environ['PR_NUMBER']),
                          'head_sha': os.environ['HEAD_SHA']}, ensure_ascii=False),
              encoding='utf-8')
          PYMETA

      - name: 検査結果をGitHubの概要に表示
        if: always()
        run: python .prguard-base/tools/ci_summary.py

      - name: 検査レポートを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-report
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: 命名チェックの合否を判定
        if: always()
        env:
          FILE_RESULT: ${{ steps.filenames.outcome }}
          IDENT_RESULT: ${{ steps.identifiers.outcome }}
        run: |
          if [ "$FILE_RESULT" != "success" ]; then
            echo 'ファイル名の命名規則チェックに失敗しました。注釈とレポートを確認してください。'
            exit 1
          fi
          if [ "$IDENT_RESULT" != "success" ]; then
            echo 'C++識別子の命名規則チェックに失敗しました（厳格モードの違反を含む）。'
            exit 1
          fi

  build-vs2019:
    name: ビルド確認（Visual Studio 2019）
    if: ${{ vars.BUILD_SYSTEM == 'vs2019' }}
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: MSBuildを準備
        uses: microsoft/setup-msbuild@v2
      - name: Visual Studioソリューションをビルド（v142）
        shell: pwsh
        env:
          SOLUTION: ${{ vars.VS_SOLUTION }}
        run: |
          if (-not $env:SOLUTION) { throw 'ActionsのVariablesにVS_SOLUTION（例: Game.sln）を登録してください' }
          msbuild "$env:SOLUTION" /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v142
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-cmake:
    name: ビルド確認（CMake）
    if: ${{ vars.BUILD_SYSTEM == 'cmake' }}
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: CMake構成を生成
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: CMakeでビルド
        run: cmake --build build --parallel 2
      - name: CTestでテストを実行
        run: ctest --test-dir build --output-on-failure --no-tests=ignore

  build-emscripten:
    name: ビルド確認（Emscripten / VS Code）
    if: ${{ vars.BUILD_SYSTEM == 'emscripten' }}
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Emscriptenを準備
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: ${{ vars.EMSDK_VERSION || '4.0.10' }}
      - name: ブラウザ向けCMake構成を生成
        run: emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: ビルドを実行
        run: cmake --build build --parallel 2
